name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_name:
        description: "可选：自定义安卓安装包名称（默认 PanPan Workbench）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK & Build-Tools
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Sync official skill-kit from upstream release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "$HOME/lovart-skill-kit/MANIFEST.json" ]; then
            python3 scripts/extract-official-skill-kit.py --out "$HOME/lovart-skill-kit"
          fi

      - name: Apply custom app name (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.app_name != '' }}
        env:
          CUSTOM_APP_NAME: ${{ inputs.app_name }}
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            cfg.productName = process.env.CUSTOM_APP_NAME;
            if (cfg.app?.windows?.[0]) cfg.app.windows[0].title = process.env.CUSTOM_APP_NAME;
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + '\n');
          "

      - name: Initialize Tauri Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi
          # Copy custom launcher icons if present
          if [ -d "src-tauri/icons/android" ]; then
            cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/ || true
          fi
          # Ensure monotonically increasing versionCode so new APKs upgrade in-place and preserve user data
          APP_VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$((10000 + ${{ github.run_number }}))
          PROPS_FILE="src-tauri/gen/android/app/tauri.properties"
          if [ -f "$PROPS_FILE" ]; then
            sed -i "s/^tauri\.android\.versionCode=.*/tauri.android.versionCode=${VERSION_CODE}/" "$PROPS_FILE"
            sed -i "s/^tauri\.android\.versionName=.*/tauri.android.versionName=${APP_VERSION}/" "$PROPS_FILE"
          else
            printf "tauri.android.versionCode=%s\ntauri.android.versionName=%s\n" "$VERSION_CODE" "$APP_VERSION" > "$PROPS_FILE"
          fi
          cat "$PROPS_FILE"

      - name: Build Android APK (aarch64)
        run: npx tauri android build --apk --target aarch64

      - name: Sign Android APK
        id: sign_apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          mkdir -p dist-apk
          APP_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="PanPan-Workbench-v${APP_VERSION}-Android-arm64-${SHORT_SHA}.apk"
          ARTIFACT_NAME="PanPan-Workbench-v${APP_VERSION}-Android-arm64-${SHORT_SHA}"
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $RAW_APK"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using persistent release keystore from GitHub Secrets (in-place upgrade supported)"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            KS_PASS="${ANDROID_KEYSTORE_PASS}"
            KS_ALIAS="${ANDROID_KEY_ALIAS:-panpan}"
            KEY_PASS="${ANDROID_KEY_PASS:-$KS_PASS}"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found; generating ephemeral keystore"
            KS_PASS="panpan123"
            KS_ALIAS="panpan"
            KEY_PASS="panpan123"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "$KS_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=PanPan Workbench, OU=AI, O=PanPan, L=Beijing, S=Beijing, C=CN"
          fi

          BUILD_TOOLS_DIR="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$RAW_APK" dist-apk/aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:${KS_PASS}" \
            --key-pass "pass:${KEY_PASS}" \
            --out "dist-apk/${APK_NAME}" \
            dist-apk/aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify -v "dist-apk/${APK_NAME}"
          rm -f dist-apk/aligned.apk release.keystore
          echo "apk_path=dist-apk/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          ls -lh dist-apk/

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign_apk.outputs.artifact_name }}
          path: ${{ steps.sign_apk.outputs.apk_path }}
          if-no-files-found: error
