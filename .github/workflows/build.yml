name: build

on:
  push:
    branches: [b02, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Sync official skill-kit from upstream release
        shell: bash
        run: |
          if [ ! -f "$HOME/lovart-skill-kit/MANIFEST.json" ]; then
            echo "Downloading upstream Windows installer to extract official 27 skills..."
            curl -fL --retry 3 -o /tmp/PanPan-setup.exe \
              "https://github.com/huang957201826-cyber/panpan-workbench/releases/download/v1.8.0/PanPan.Workbench_1.8.0_x64-setup.exe"
            python scripts/extract-official-skill-kit.py --exe /tmp/PanPan-setup.exe --out "$HOME/lovart-skill-kit"
            rm -f /tmp/PanPan-setup.exe
            node scripts/sync-skill-kit.mjs
          fi
      - name: Frontend gate
        run: npm run gate:dev
      - name: Security scan
        run: npm run security:check
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Test UI end-to-end
        run: npm run e2e
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            artifacts/e2e-report
            artifacts/e2e-results
          if-no-files-found: ignore
